name: build

# Windows only. Everyday pushes skip link-time optimisation (much faster to build); tags and manual
# runs (Actions tab > build > Run workflow) build with it, for release.

on:
  push:
  pull_request:
  workflow_dispatch:

# a newer push to the same branch cancels the run it supersedes
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_TAG: 8.0.4 # keep in step with GIT_TAG in CMakeLists.txt
  LTO: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && 'ON' || 'OFF' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # JUCE source, downloaded once and reused
      - name: Cache JUCE
        id: juce
        uses: actions/cache@v4
        with:
          path: juce-src
          key: juce-${{ env.JUCE_TAG }}-windows

      - name: Get JUCE
        if: steps.juce.outputs.cache-hit != 'true'
        shell: bash
        run: git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git juce-src

      - name: Configure
        shell: bash
        run: |
          # -MP: MSVC compiles the files of each project in parallel (MSBuild only runs projects in parallel)
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_SOURCE_DIR_JUCE="$(cygpath -m "$PWD/juce-src")" \
            -DCMAKE_CXX_FLAGS_INIT=-MP -DCMAKE_C_FLAGS_INIT=-MP \
            -DORBITPAN_LTO=$LTO
          echo "Link-time optimisation: $LTO"

      - name: Build
        shell: bash
        run: |
          TARGETS="dsp_tests render_demo PluginTests OrbitPan_VST3 leveler_tests BassLevelerPluginTests BassNoteLeveler_VST3 notespace_tests NoteSpacePluginTests NoteSpace_VST3 steelwave_tests steelwave_engine_tests SteelwavePluginTests Steelwave_VST3 Steelwave_Standalone pumporgan_tests PumpOrganPluginTests PumpOrgan_VST3 PumpOrgan_Standalone"
          cmake --build build --config Release --parallel 4 --target $TARGETS

      - name: Test (DSP cores and plug-in processors)
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect plug-in bundles
        shell: bash
        run: |
          mkdir -p dist/orbitpan dist/bassleveler dist/notespace dist/steelwave dist/pumporgan
          find build -type d -name "OrbitPan.vst3" -prune -exec cp -R {} dist/orbitpan/ \;
          find build -type d -name "Bass Note Leveler.vst3" -prune -exec cp -R {} dist/bassleveler/ \;
          find build -type d -name "Note Space.vst3" -prune -exec cp -R {} dist/notespace/ \;
          find build -type d -name "Steelwave.vst3" -prune -exec cp -R {} dist/steelwave/ \;
          find build -path "*Steelwave_artefacts*Standalone*" -name "Steelwave.exe" -exec cp {} dist/steelwave/ \;
          find build -type d -name "Pump Organ.vst3" -prune -exec cp -R {} dist/pumporgan/ \;
          find build -path "*PumpOrgan_artefacts*Standalone*" -name "Pump Organ.exe" -exec cp {} dist/pumporgan/ \;
          ls -R dist | head -40

      - name: DLLs must not need the VC++ redistributable
        shell: bash
        run: |
          pip install pefile
          python tools/check_dll_imports.py "dist/orbitpan/OrbitPan.vst3/Contents/x86_64-win/OrbitPan.vst3"
          python tools/check_dll_imports.py "dist/bassleveler/Bass Note Leveler.vst3/Contents/x86_64-win/Bass Note Leveler.vst3"
          python tools/check_dll_imports.py "dist/notespace/Note Space.vst3/Contents/x86_64-win/Note Space.vst3"
          python tools/check_dll_imports.py "dist/steelwave/Steelwave.vst3/Contents/x86_64-win/Steelwave.vst3"
          python tools/check_dll_imports.py "dist/pumporgan/Pump Organ.vst3/Contents/x86_64-win/Pump Organ.vst3"

      - name: pluginval (strictness 10)
        shell: bash
        run: |
          curl -L -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          7z x -y pluginval.zip -opluginval >/dev/null
          for p in "dist/orbitpan/OrbitPan.vst3" "dist/bassleveler/Bass Note Leveler.vst3" "dist/notespace/Note Space.vst3" "dist/steelwave/Steelwave.vst3" "dist/pumporgan/Pump Organ.vst3"; do
            pluginval/pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 180000 "$p"
          done

      # Code signing (Steelwave): with a certificate in the repository's secrets, the plug-in, the app and
      # the installer are signed, so Windows SmartScreen trusts them. Without one, everything builds unsigned.
      #   WINDOWS_CERT_PFX: the .pfx certificate, base64-encoded    WINDOWS_CERT_PASSWORD: its password
      - name: Code signing certificate
        id: cert
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          if ($env:CERT_PFX) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CERT_PFX))
            "present=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No WINDOWS_CERT_PFX secret: building unsigned"
            "present=false" >> $env:GITHUB_OUTPUT
          }

      - name: Sign Steelwave plug-in and app
        if: steps.cert.outputs.present == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "dist\steelwave\Steelwave.vst3\Contents\x86_64-win\Steelwave.vst3" "dist\steelwave\Steelwave.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: OrbitPan-windows
          path: dist/orbitpan

      - uses: actions/upload-artifact@v4
        with:
          name: BassNoteLeveler-windows
          path: dist/bassleveler

      - uses: actions/upload-artifact@v4
        with:
          name: NoteSpace-windows
          path: dist/notespace

      - uses: actions/upload-artifact@v4
        with:
          name: Steelwave-windows
          path: dist/steelwave

      - uses: actions/upload-artifact@v4
        with:
          name: PumpOrgan-windows
          path: dist/pumporgan

      # Setup .exe: installs the VST3 to Common Files\VST3 and the standalone app to Program Files
      - name: Steelwave installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=1.0.0" "/DSrc=$PWD\dist\steelwave" "steelwave\installer\Steelwave.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign Steelwave installer
        if: steps.cert.outputs.present == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          Get-ChildItem steelwave\installer\Output\*.exe | ForEach-Object {
            & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"

      - uses: actions/upload-artifact@v4
        with:
          name: Steelwave-windows-installer
          path: steelwave/installer/Output/*.exe
