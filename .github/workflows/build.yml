name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: Build
        shell: bash
        run: |
          TARGETS="dsp_tests render_demo PluginTests OrbitPan_VST3 leveler_tests BassLevelerPluginTests BassNoteLeveler_VST3 notespace_tests NoteSpacePluginTests NoteSpace_VST3"
          if [ "$RUNNER_OS" = "macOS" ]; then TARGETS="$TARGETS OrbitPan_AU BassNoteLeveler_AU NoteSpace_AU"; fi
          cmake --build build --config Release --parallel 4 --target $TARGETS

      - name: Test (DSP + plugin processors, both plug-ins)
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          find build \( -name "*.vst3" -o -name "*.component" \) -type d -prune | while read -r b; do codesign --force --deep -s - "$b"; done

      - name: Collect plug-in bundles
        shell: bash
        run: |
          mkdir -p dist/orbitpan dist/bassleveler dist/notespace
          find build -type d -name "OrbitPan.vst3" -prune -exec cp -R {} dist/orbitpan/ \;
          find build -type d -name "OrbitPan.component" -prune -exec cp -R {} dist/orbitpan/ \;
          find build -type d -name "Bass Note Leveler.vst3" -prune -exec cp -R {} dist/bassleveler/ \;
          find build -type d -name "Bass Note Leveler.component" -prune -exec cp -R {} dist/bassleveler/ \;
          find build -type d -name "Note Space.vst3" -prune -exec cp -R {} dist/notespace/ \;
          find build -type d -name "Note Space.component" -prune -exec cp -R {} dist/notespace/ \;
          ls -R dist | head -40

      - name: Windows DLLs must not need the VC++ redistributable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pip install pefile
          python tools/check_dll_imports.py "dist/orbitpan/OrbitPan.vst3/Contents/x86_64-win/OrbitPan.vst3"
          python tools/check_dll_imports.py "dist/bassleveler/Bass Note Leveler.vst3/Contents/x86_64-win/Bass Note Leveler.vst3"
          python tools/check_dll_imports.py "dist/notespace/Note Space.vst3/Contents/x86_64-win/Note Space.vst3"

      - name: pluginval (strictness 10)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   URL=https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip ;;
            macOS)   URL=https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip ;;
            Windows) URL=https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip ;;
          esac
          curl -L -o pluginval.zip "$URL"
          7z x -y pluginval.zip -opluginval >/dev/null || unzip -o pluginval.zip -d pluginval
          run_pv() {
            if [ "$RUNNER_OS" = "Linux" ]; then
              chmod +x pluginval/pluginval
              xvfb-run -a pluginval/pluginval --strictness-level 10 --validate-in-process --timeout-ms 180000 "$1"
            elif [ "$RUNNER_OS" = "macOS" ]; then
              PV=$(find pluginval -type f -path "*MacOS/pluginval" | head -1)
              chmod +x "$PV"
              "$PV" --strictness-level 10 --validate-in-process --timeout-ms 180000 "$1"
            else
              pluginval/pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 180000 "$1"
            fi
          }
          run_pv "dist/orbitpan/OrbitPan.vst3"
          run_pv "dist/bassleveler/Bass Note Leveler.vst3"
          run_pv "dist/notespace/Note Space.vst3"

      - uses: actions/upload-artifact@v4
        with:
          name: OrbitPan-${{ matrix.name }}
          path: dist/orbitpan

      - uses: actions/upload-artifact@v4
        with:
          name: BassNoteLeveler-${{ matrix.name }}
          path: dist/bassleveler

      - uses: actions/upload-artifact@v4
        with:
          name: NoteSpace-${{ matrix.name }}
          path: dist/notespace
